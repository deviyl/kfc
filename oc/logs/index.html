<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crime Alert Logs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <h1>Crime Alert Dashboard</h1>
    
    <div class="controls-container">
      <input type="text" id="search-input" placeholder="Search by username or user ID..." autocomplete="off" />
      <div id="alert-filters" class="alert-filters"></div>
    </div>

    <div id="status-message" class="status-message">Loading log data...</div>
    
    <main id="tables-container" class="tables-container"></main>
  </div>

  <script src="script.js"></script>
</body>
</html>
