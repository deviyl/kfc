<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bully Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            <h1>Bully Bot</h1>
            <button type="button" id="logout-btn" class="action-btn logout-btn">Logout</button>

            <div id="alert-banner"></div>

            <div id="auth-section" class="script-card auth-card">
                <div class="section-header">
                    <h2>Authentication</h2>
                </div>
                <p class="subsection-note">Enter your API Key to verify membership in KFC.<br>This key is not stored and is just used for authentication.</p>
                <div class="auth-input-group">
                    <input type="password" id="auth-key-input" class="form-input" placeholder="Enter your API Key...">
                    <button type="button" id="auth-submit-btn" class="action-btn">Login</button>
                </div>
            </div>

            <div id="dashboard-section" class="dashboard-section">
                <div class="scripts-section">
                    <div class="script-card dashboard-card">
                        <div class="subsection-title">Current Keys Stored</div>
                        <div id="keys-note" class="subsection-note"></div>
                        <div id="api-keys-list" class="list-container"></div>
                        <div class="input-action-group">
                            <input type="text" id="new-api-key" class="form-input" placeholder="Enter new API Key...">
                            <button type="button" id="add-key-btn" class="action-btn">Add Key</button>
                        </div>

                        <div class="subsection-title">Monitored Users</div>
                        <div class="subsection-note">Users currently being monitored.</div>
                        <div id="monitored-users-list" class="list-container"></div>
                        <div class="input-action-group stacked-input-group">
                            <input type="text" id="new-user-id" class="form-input" placeholder="Enter User ID...">
                            <input type="text" id="new-user-reason" class="form-input" placeholder="Enter reason (optional)...">
                            <button type="button" id="add-user-btn" class="action-btn">Add User</button>
                        </div>

                        <div id="admin-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
